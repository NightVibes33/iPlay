name: Build unsigned iPlay IPA

concurrency:
  group: ios-unsigned-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - temp/ios-carplay-headunit
    paths:
      - "iOS/**"
      - "scripts/build-ios-unsigned.sh"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash scripts/build-ios-unsigned.sh
      - name: Verify IPA and A-to-A path
        run: |
          set -euo pipefail
          unzip -l build-ios/iPlay-unsigned.ipa
          file build-ios/Payload/iPlay.app/iPlay

          APP=build-ios/Payload/iPlay.app
          BIN="$APP/iPlay"

          # SideStore must receive an actually unsigned app.
          if codesign -dv "$BIN" >/dev/null 2>&1; then
            echo "ERROR: iPlay binary unexpectedly has a code signature"
            exit 1
          fi
          test ! -e "$APP/_CodeSignature"
          test ! -e "$APP/embedded.mobileprovision"

          # A green build must contain the real same-device CarPlay path,
          # not merely a receiver shell.
          strings "$BIN" | grep -F "APEndpointManagerCarPlayCreate"
          strings "$BIN" | grep -F "APCarSessionRequestHandler"
          strings "$BIN" | grep -F "addCarPlayHelper:"
          strings "$BIN" | grep -F "startSessionWithHost:requestIdentifier:completion:"
          strings "$BIN" | grep -F "registerSessionRequestHandlerMachService"
          nm "$BIN" | grep -F "_iPlayCarPlayServiceMain"
          strings "$BIN" | grep -F "_airplay._tcp"
          strings "$BIN" | grep -F "_raop._tcp"
          strings "$BIN" | grep -F "com.apple.carkit.service.shim.remote"
          strings "$BIN" | grep -F "_remotepairing-pairable-host._tcp."
          strings "$BIN" | grep -F "LocalDevVPN"

          # Real upstream UI / input controls must be in the shipped binary.
          strings "$BIN" | grep -F "CarPlay settings"
          strings "$BIN" | grep -F "Physical length"
          strings "$BIN" | grep -F "Physical size basis"
          strings "$BIN" | grep -F -- "--height-physical-mm"
          strings "$BIN" | grep -F "Safe area"
          strings "$BIN" | grep -F "Draw outside safe area"
          strings "$BIN" | grep -F "Exit application"
          strings "$BIN" | grep -F "viewAreas"
          strings "$BIN" | grep -F "drawUIOutsideSafeArea"
          strings "$BIN" | grep -F -- "--safe-left"
          strings "$BIN" | grep -F "OEM label"
          strings "$BIN" | grep -F "Choose image"
          strings "$BIN" | grep -F "Manufacturer"
          strings "$BIN" | grep -F "Debug logs"
          strings "$BIN" | grep -F "Waiting for iPlay logs"
          strings "$BIN" | grep -F "Resolution handshake:"
          strings "$BIN" | grep -F "CarPlay physical size:"
          strings "$BIN" | grep -F "airplay-icon.png"
          strings "$BIN" | grep -F "LocationInformation"
          strings "$BIN" | grep -F "2a2a2a2a"
          strings "$BIN" | grep -F "Finding iPlay"
          test -s "$APP/ic_carplay.png"
          test -s "$APP/ic_car_home.png"

          # Guard against the old fake/pause overlay returning to the source.
          grep -F "ThreeFingerSwipeDownGestureRecognizer" iOS/SideStoreReceiver/iPlay.m
          grep -F '#include "upstream_ui.inc"' iOS/SideStoreReceiver/iPlay.m
          grep -F 'if (iPlayIsStockSideStoreBuild()) [self showUpstreamSettingsReal];' \
            iOS/SideStoreReceiver/iPlay.m
          grep -F '[self showUpstreamSettings];' iOS/SideStoreReceiver/iPlay.m
          grep -F -- '- (void)showUpstreamSettingsReal {' \
            iOS/SideStoreReceiver/upstream_ui.inc
          grep -F 'chooseRemoteAtoBReceiverFrom:weakSettings' \
            iOS/SideStoreReceiver/upstream_ui.inc
          grep -F 'setDebugOverlayEnabled:' iOS/SideStoreReceiver/iPlay.m
          grep -F 'debugOverlayTailText' iOS/SideStoreReceiver/iPlay.m
          grep -F 'sizeof(argsTrusted) / sizeof(argsTrusted[0])' iOS/SideStoreReceiver/iPlay.m
          grep -F 'sizeof(argsNormal) / sizeof(argsNormal[0])' iOS/SideStoreReceiver/iPlay.m
          # Keep first-launch control defaults aligned with upstream persistence.
          grep -F 'requestedFPS = 30;' iOS/SideStoreReceiver/iPlay.m
          grep -F 'referencePhysicalMm = 300;' iOS/SideStoreReceiver/iPlay.m
          grep -F 'defaultValue:30' iOS/SideStoreReceiver/upstream_ui.inc
          grep -F 'static uint16_t g_display_fps = 30;' iOS/SideStoreReceiver/carplay_services.m
          if grep -A2 -F 'objectForKey:@"iPlayAudioFocus"] == nil' iOS/SideStoreReceiver/iPlay.m | grep -F '? YES'; then
            echo "ERROR: Audio Focus default drifted from upstream"
            exit 1
          fi
          grep -F 'initWithItems:@[@"This iPhone · A → A", @"Receive · A → B", @"Send · A → B"]' \
            iOS/SideStoreReceiver/iPlay.m
          grep -F 'if (mode == 2) [self startRemoteAtoB];' iOS/SideStoreReceiver/iPlay.m
          grep -F 'iPlayIsStockSideStoreBuild() && self.sideStoreMode == 2' \
            iOS/SideStoreReceiver/iPlay.m
          grep -F 'chooseRemoteAtoBReceiverFrom:self.vc connectAfterSelection:NO' \
            iOS/SideStoreReceiver/iPlay.m
          grep -F '[self.vc dismissViewControllerAnimated:YES completion:^{' \
            iOS/SideStoreReceiver/upstream_ui.inc
          grep -F 'setInteger:0 forKey:@"iPlayLastMode"' \
            iOS/SideStoreReceiver/upstream_ui.inc
          grep -F 'Use this iPhone for A → A, or choose another iPhone running iPlay in Receive mode.' \
            iOS/SideStoreReceiver/iPlay.m
          grep -F 'iPlayDiscoverRemoteCarPlayReceivers' \
            iOS/SideStoreReceiver/SideStoreBridge.m
          grep -F '_iplay-carplay._tcp' \
            iOS/SideStoreReceiver/SideStoreBridge.m
          if grep -E "ControlsOverlayView|Three-finger tap to return to CarPlay|buildSetupOverlay" \
              iOS/SideStoreReceiver/iPlay.m; then
            echo "ERROR: obsolete fake CarPlay UI/chrome returned"
            exit 1
          fi

          if grep -F 'if (selected == NSNotFound) selected = 0;' \
              iOS/SideStoreReceiver/upstream_ui.inc; then
            echo "ERROR: home settings collapsed a custom runtime value to a fake preset"
            exit 1
          fi

          # Stock SideStore build must never instruct users to install jailbreak tooling.
          if strings "$BIN" | grep -F "Sileo"; then
            echo "ERROR: SideStore binary still contains Sileo/jailbreak install messaging"
            exit 1
          fi

          # Private frameworks are intentionally runtime-loaded instead of
          # hard-linked, so SideStore can sign the normal application binary.
          if otool -L "$BIN" | grep -E "AirPlaySender|APTransport|CarKit|BluetoothManager"; then
            echo "ERROR: private framework unexpectedly hard-linked"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPlay-unsigned-ipa
          path: build-ios/iPlay-unsigned.ipa
          if-no-files-found: error
