name: Build unsigned iPlay IPA

on:
  workflow_dispatch:
  push:
    branches:
      - temp/ios-carplay-headunit
    paths:
      - "iOS/**"
      - "scripts/build-ios-unsigned.sh"
      - ".github/workflows/ios-unsigned-ipa.yml"

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: bash scripts/build-ios-unsigned.sh
      - name: Verify IPA
        run: |
          unzip -l build-ios/iPlay-unsigned.ipa
          file build-ios/Payload/iPlay.app/iPlay
          file build-ios/Payload/iPlay.app/carplay_services
          if codesign -dv build-ios/Payload/iPlay.app/iPlay >/dev/null 2>&1; then exit 1; fi
      - uses: actions/upload-artifact@v4
        with:
          name: iPlay-unsigned-ipa
          path: build-ios/iPlay-unsigned.ipa
          if-no-files-found: error
